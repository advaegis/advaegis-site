# Weekly, grouped update PRs. Claude Code reviews and fixes them; you merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # @astrojs/check (npm run typecheck) supports TypeScript 5 and 6 only.
      # Remove when its peerDependencies accept 7.
      - dependency-name: typescript
        versions: ['>=7']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)
